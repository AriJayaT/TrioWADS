name: YipHelp CI/CD

on:
  push:
    branches:
      - master
    paths-ignore:
      - "README.md"
  pull_request:
    branches:
      - master

jobs:
  continuous-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/yiphelp-backend:latest ./server
          docker push ${{ secrets.DOCKER_USERNAME }}/yiphelp-backend:latest

      - name: Build and Push Frontend Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/yiphelp-frontend:latest ./Frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/yiphelp-frontend:latest

  continuous-deployment:
    needs: continuous-integration
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Docker Rootless Environment
        run: |
          echo "Setting up Docker rootless env..."
          echo "export PATH=$HOME/bin:$PATH" >> $GITHUB_ENV
          echo "export DOCKER_HOST=unix://$XDG_RUNTIME_DIR/docker.sock" >> $GITHUB_ENV

      - name: Pull Latest Backend Image
        run: docker pull ${{ secrets.DOCKER_USERNAME }}/yiphelp-backend:latest

      - name: Pull Latest Frontend Image
        run: docker pull ${{ secrets.DOCKER_USERNAME }}/yiphelp-frontend:latest

      - name: Stop and Remove Old Containers
        run: |
          docker compose down || true
          docker system prune -f

      - name: Run New Containers
        run: |
          docker compose up -d
        env:
          MONGODB_URI: ${MONGODB_URI}
          JWT_SECRET: ${JWT_SECRET}
          JWT_ECPIRATION: ${JWT_ECPIRATION}
          PORT: ${PORT}
          NODE_ENV: ${NODE_ENV}
          VITE_API_URL: ${VITE_API_URL}
          EMAIL_USER: ${EMAIL_USER}
          EMAIL_PASSWORD: ${EMAIL_PASSWORD}
          VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
          GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
          REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
          OPENAI_API_KEY: ${OPENAI_API_KEY}